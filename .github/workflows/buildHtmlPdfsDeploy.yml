name: deploy-book

on:
  push:
    branches:
    - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r Book/requirements.txt

    - name: Clean and Build the book
      run: |
          jupyter-book clean ./Book/ --all
          #rm -rf Book/_build
          jupyter-book build ./Book

    # - name: Isolate and Build the Book in a Clean Directory
    #   run: |
    #     mkdir clean_book_build
    #     cd clean_book_build
    #     cp -r ../Book/Chapters .
    #     cp -r ../Book/_static .
    #     cp ../Book/index.md .
    #     cp ../Book/_toc.yml .
    #     cp ../Book/_config.yml .
    #     jupyter-book build .


    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "Book/_build/html"
        # path: "clean_book_build/_build/html"
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
