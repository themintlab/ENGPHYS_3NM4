<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Euler Method Comparison</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    <!-- Load Chart.js for plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-2xl p-6 md:p-10">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Explicit vs. Implicit Euler Methods
        </h1>
        <p class="text-center text-gray-600 mb-8">
            Adjust the time step size (h) to observe the stability and accuracy of the two numerical methods for solving dy/dt = -y.
        </p>

        <!-- Slider Control Area -->
        <div class="mb-10 p-5 bg-indigo-50 rounded-lg shadow-inner">
            <label for="h-slider" class="block text-lg font-medium text-indigo-700 mb-3">
                Time Step (h): <span id="h-value" class="font-mono text-xl ml-2">0.8</span>
            </label>
            <input type="range" id="h-slider" min="0.1" max="5.0" step="0.1" value="0.8"
                   class="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer range-lg">
        </div>

        <!-- Plotting Area -->
        <div class="relative h-[400px] md:h-[500px]">
            <canvas id="eulerChart"></canvas>
        </div>
    </div>

    <script>
        // --- Core Constants ---
        const T0 = 0;
        const T_END = 20;
        const Y0 = 2;
        const H_DEFAULT = 0.8;

        // --- DOM Elements ---
        const hSlider = document.getElementById('h-slider');
        const hValueDisplay = document.getElementById('h-value');
        const ctx = document.getElementById('eulerChart').getContext('2d');
        let eulerChart;

        /**
         * Solves the ODE dy/dt = -y using different methods.
         * @param {number} h The time step size.
         * @returns {{t: number[], analytical: number[], explicit: number[], implicit: number[]}}
         */
        function solveODE(h) {
            const t = [];
            let t_current = T0;
            while (t_current <= T_END + h / 2) { // Tolerance added for floating point
                t.push(t_current);
                t_current += h;
            }

            const y_analytical = t.map(time => Y0 * Math.exp(-time));
            const y_explicit = [Y0];
            const y_implicit = [Y0];

            for (let i = 0; i < t.length - 1; i++) {
                // Explicit Euler: y[i+1] = y[i] * (1 - h)
                const y_e_next = y_explicit[i] * (1 - h);
                y_explicit.push(y_e_next);

                // Implicit Euler: y[i+1] = y[i] / (1 + h)
                const y_i_next = y_implicit[i] / (1 + h);
                y_implicit.push(y_i_next);
            }

            // Trim the arrays to match the time steps exactly (for Chart.js labels)
            const minLength = Math.min(t.length, y_analytical.length, y_explicit.length, y_implicit.length);
            t.length = minLength;
            y_analytical.length = minLength;
            y_explicit.length = minLength;
            y_implicit.length = minLength;


            return { t, analytical: y_analytical, explicit: y_explicit, implicit: y_implicit };
        }

        /**
         * Initializes or updates the Chart.js plot.
         */
        function updatePlot() {
            const h = parseFloat(hSlider.value);
            hValueDisplay.textContent = h.toFixed(1);

            const { t, analytical, explicit, implicit } = solveODE(h);

            const labels = t.map(val => val.toFixed(1));

            const newData = {
                labels: labels,
                datasets: [
                    {
                        label: 'Analytical Solution',
                        data: analytical,
                        borderColor: 'rgb(20, 20, 20)', // Near black
                        backgroundColor: 'transparent',
                        borderWidth: 3,
                        borderDash: [5, 5], // Dashed line
                        pointRadius: 0,
                    },
                    {
                        label: 'Explicit Euler',
                        data: explicit,
                        borderColor: 'rgb(59, 130, 246)', // Blue-500
                        backgroundColor: 'transparent',
                        pointRadius: 4,
                        pointBackgroundColor: 'rgb(59, 130, 246)',
                        pointStyle: 'circle',
                        tension: 0, // Straight lines between points
                    },
                    {
                        label: 'Implicit Euler',
                        data: implicit,
                        borderColor: 'rgb(239, 68, 68)', // Red-500
                        backgroundColor: 'transparent',
                        pointRadius: 5,
                        pointBackgroundColor: 'rgb(239, 68, 68)',
                        pointStyle: 'crossRot', // 'x' marker
                        tension: 0,
                    }
                ]
            };

            if (eulerChart) {
                // Update existing chart
                eulerChart.data = newData;
                eulerChart.update();
            } else {
                // Initialize the chart
                eulerChart = new Chart(ctx, {
                    type: 'line',
                    data: newData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            title: {
                                display: true,
                                text: 'Comparison of Explicit and Implicit Euler Methods',
                                font: { size: 16 }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Time (t)'
                                },
                                ticks: {
                                    // Only show a few major ticks
                                    autoSkip: true,
                                    maxTicksLimit: 15
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'y(t)'
                                },
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        }

        // --- Event Listeners & Initialization ---

        hSlider.addEventListener('input', updatePlot);

        // Initial plot load
        updatePlot();
    </script>
</body>
</html>
